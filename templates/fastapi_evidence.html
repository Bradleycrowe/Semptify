<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Evidence Capture - Semptify</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        h1 { color: #667eea; margin-bottom: 30px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 5px; color: #333; font-weight: 600; }
        input, textarea { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 5px; }
        textarea { min-height: 80px; }
        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: 600;
        }
        #status { margin-top: 20px; padding: 15px; border-radius: 5px; display: none; }
        .success { background: #c8e6c9; color: #2e7d32; }
        .error { background: #ffcdd2; color: #c62828; }
        .back-link { display: inline-block; margin-top: 20px; color: #667eea; text-decoration: none; }
    </style>
</head>
<body>
    <div class="container">
        <h1>📸 Evidence Capture</h1>
        
        <form id="evidence-form" enctype="multipart/form-data">
            <div class="form-group">
                <label>Upload Evidence File (Photo/Video/Audio)</label>
                <input type="file" name="file" required accept="image/*,video/*,audio/*">
            </div>
            
            <div class="form-group">
                <label>Description</label>
                <textarea name="description" placeholder="Describe this evidence..."></textarea>
            </div>
            
            <button type="submit" class="btn">Upload Evidence</button>
        </form>
        
        <div id="status"></div>
        
        <a href="/hub" class="back-link">← Back to Hub</a>
    </div>
    
    <script>
        const form = document.getElementById('evidence-form');
        const status = document.getElementById('status');
        
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const formData = new FormData(form);
            
            try {
                const response = await fetch('/evidence/upload', {
                    method: 'POST',
                    body: formData
                });
                const data = await response.json();
                
                if (data.success) {
                    status.className = 'success';
                    status.textContent = '✓ ' + data.message;
                    status.style.display = 'block';
                    form.reset();
                } else {
                    throw new Error(data.error);
                }
            } catch (error) {
                status.className = 'error';
                status.textContent = '✗ Error: ' + error.message;
                status.style.display = 'block';
            }
        });
    </script>
</body>
</html>
