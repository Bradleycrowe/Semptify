<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calendar & Timeline - Semptify</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0a0e27; color: #fff; padding: 20px; }
        .container { max-width: 1200px; margin: 0 auto; }
        header { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); padding: 30px; border-radius: 12px; margin-bottom: 30px; }
        h1 { font-size: 32px; margin-bottom: 10px; }
        .controls { background: #1a1f3a; padding: 20px; border-radius: 12px; margin-bottom: 20px; display: flex; gap: 16px; flex-wrap: wrap; }
        input { background: #252a45; color: #fff; border: 1px solid #2a2f4a; padding: 12px; border-radius: 8px; font-size: 14px; }
        button { background: #667eea; color: #fff; border: none; padding: 12px 24px; border-radius: 8px; cursor: pointer; font-weight: 600; transition: 0.2s; }
        button:hover { background: #5568d3; }
        .grid { display: grid; grid-template-columns: 1fr 2fr; gap: 20px; }
        .card { background: #1a1f3a; border-radius: 12px; padding: 24px; border: 1px solid #2a2f4a; }
        .card h2 { color: #667eea; margin-bottom: 20px; }
        .stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-bottom: 20px; }
        .stat { background: #252a45; padding: 16px; border-radius: 8px; text-align: center; }
        .stat-value { font-size: 28px; font-weight: 700; color: #667eea; }
        .stat-label { font-size: 12px; color: #8b92b0; margin-top: 4px; }
        .timeline { max-height: 600px; overflow-y: auto; }
        .event { background: #252a45; padding: 16px; border-radius: 8px; margin-bottom: 12px; border-left: 4px solid #667eea; }
        .event.timeline { border-left-color: #667eea; }
        .event.vault { border-left-color: #10b981; }
        .event.rent { border-left-color: #f59e0b; }
        .event.court { border-left-color: #ef4444; }
        .event-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
        .event-title { font-weight: 600; font-size: 16px; }
        .event-date { font-size: 12px; color: #8b92b0; }
        .event-desc { color: #8b92b0; font-size: 14px; margin-top: 8px; }
        .badge { display: inline-block; padding: 4px 12px; border-radius: 12px; font-size: 11px; font-weight: 600; text-transform: uppercase; }
        .badge.timeline { background: #667eea; }
        .badge.vault { background: #10b981; }
        .badge.rent { background: #f59e0b; }
        .badge.court { background: #ef4444; }
        .loading { text-align: center; padding: 40px; color: #8b92b0; }
        .empty { text-align: center; padding: 40px; color: #8b92b0; }
        .filter-btn { background: #252a45; color: #8b92b0; }
        .filter-btn.active { background: #667eea; color: #fff; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>📅 Calendar & Timeline</h1>
            <p style="color: rgba(255,255,255,0.8); margin-top: 8px;">Your events, documents, and important dates</p>
        </header>

        <div class="controls">
            
            <button onclick="loadEvents()">📥 Load Events</button>
            <button onclick="exportCalendar()">📤 Export .ics</button>
            <button onclick="showAddEvent()">➕ Add Event</button>
        </div>

        <div class="grid">
            <div>
                <div class="card">
                    <h2>📊 Overview</h2>
                    <div class="stats">
                        <div class="stat">
                            <div class="stat-value" id="totalEvents">0</div>
                            <div class="stat-label">Total Events</div>
                        </div>
                        <div class="stat">
                            <div class="stat-value" id="timelineCount">0</div>
                            <div class="stat-label">Timeline</div>
                        </div>
                        <div class="stat">
                            <div class="stat-value" id="vaultCount">0</div>
                            <div class="stat-label">Vault Docs</div>
                        </div>
                        <div class="stat">
                            <div class="stat-value" id="rentCount">0</div>
                            <div class="stat-label">Rent Entries</div>
                        </div>
                    </div>
                    
                    <h3 style="margin: 20px 0 12px; font-size: 16px; color: #8b92b0;">Filter by Type</h3>
                    <div style="display: flex; flex-direction: column; gap: 8px;">
                        <button class="filter-btn active" onclick="filterEvents('all')">All Events</button>
                        <button class="filter-btn" onclick="filterEvents('timeline')">Timeline Only</button>
                        <button class="filter-btn" onclick="filterEvents('vault')">Vault Docs</button>
                        <button class="filter-btn" onclick="filterEvents('rent')">Rent Payments</button>
                    </div>
                </div>
            </div>

            <div>
                <div class="card">
                    <h2>📋 Events Timeline</h2>
                    <div class="timeline" id="timeline">
                        <div class="empty">Enter User ID and click Load Events</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let allEvents = [];
        let currentFilter = 'all';

        async function loadEvents() {
            const userId = "demo_user";
            // Auto-load with demo_user

            document.getElementById('timeline').innerHTML = '<div class="loading">⏳ Loading events...</div>';

            try {
                const response = await fetch(`/calendar/api/events?user_id=${userId}`);
                const data = await response.json();
                
                allEvents = data.events;
                
                // Update stats
                document.getElementById('totalEvents').textContent = data.total_events;
                document.getElementById('timelineCount').textContent = data.sources.timeline;
                document.getElementById('vaultCount').textContent = data.sources.vault;
                document.getElementById('rentCount').textContent = data.sources.rent;
                
                displayEvents(allEvents);
            } catch (error) {
                document.getElementById('timeline').innerHTML = '<div class="empty">❌ Error loading events</div>';
                console.error('Error:', error);
            }
        }

        function displayEvents(events) {
            const timeline = document.getElementById('timeline');
            
            if (events.length === 0) {
                timeline.innerHTML = '<div class="empty">No events found</div>';
                return;
            }

            timeline.innerHTML = events.map(event => `
                <div class="event ${event.type}">
                    <div class="event-header">
                        <div class="event-title">${event.title}</div>
                        <span class="badge ${event.type}">${event.type}</span>
                    </div>
                    <div class="event-date">�� ${formatDate(event.date)}</div>
                    ${event.description ? `<div class="event-desc">${event.description}</div>` : ''}
                    <div style="margin-top: 8px; font-size: 12px; color: #667eea;">
                        Source: ${event.source}
                    </div>
                </div>
            `).join('');
        }

        function filterEvents(type) {
            currentFilter = type;
            
            // Update button states
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            event.target.classList.add('active');
            
            const filtered = type === 'all' ? allEvents : allEvents.filter(e => e.type === type);
            displayEvents(filtered);
        }

        async function exportCalendar() {
            const userId = "demo_user";
            // Auto-load with demo_user

            try {
                const response = await fetch(`/calendar/api/export/ical?user_id=${userId}`);
                const data = await response.json();
                
                if (data.status === 'success') {
                    const blob = new Blob([data.ical_data], { type: 'text/calendar' });
                    const url = window.URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = data.filename;
                    a.click();
                    alert('✅ Calendar exported successfully!');
                }
            } catch (error) {
                alert('❌ Export failed');
                console.error('Error:', error);
            }
        }

        function showAddEvent() {
            const userId = "demo_user";
            if (!userId) {
                alert('Please enter a User ID first');
                return;
            }
            
            const title = prompt('Event title:');
            if (!title) return;
            
            const description = prompt('Event description (optional):') || '';
            const date = prompt('Event date (YYYY-MM-DD):') || new Date().toISOString().split('T')[0];
            
            addEvent(userId, title, description, date);
        }

        async function addEvent(userId, title, description, date) {
            try {
                const formData = new URLSearchParams();
                formData.append('user_id', userId);
                formData.append('title', title);
                formData.append('description', description);
                formData.append('event_date', date + 'T12:00:00Z');
                
                const response = await fetch('/calendar/api/events/add', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: formData
                });
                
                const data = await response.json();
                if (data.status === 'success') {
                    alert('✅ Event added!');
                    loadEvents();
                }
            } catch (error) {
                alert('❌ Failed to add event');
                console.error('Error:', error);
            }
        }

        function formatDate(dateStr) {
            if (!dateStr) return 'Unknown date';
            try {
                const date = new Date(dateStr);
                return date.toLocaleDateString('en-US', { 
                    year: 'numeric', 
                    month: 'short', 
                    day: 'numeric',
                    hour: '2-digit',
                    minute: '2-digit'
                });
            } catch {
                return dateStr;
            }
        }
    
        // Auto-load events on page load
        window.addEventListener('DOMContentLoaded', () => {
            loadEvents();
        });
    </script>
</body>
</html>
